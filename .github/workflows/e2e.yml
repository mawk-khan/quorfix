name: e2e

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/e2e.yml"

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Real Postgres + Redis, matching what backend.yml's own job uses —
    # session auth, the login/setup throttles, and CSRF all depend on both
    # being real services, not mocks.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bugfixer
          POSTGRES_USER: bugfixer
          POSTGRES_PASSWORD: bugfixer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bugfixer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-secret-key
      # development, not test: the e2e suite needs a real Postgres+Redis
      # backend running as an actual server (not pytest's in-process test
      # client), and config.settings.development is what that's for. Its
      # throttle rates were deliberately loosened for exactly this kind of
      # sign-in-heavy scenario — see the comment in that settings module.
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: bugfixer
      POSTGRES_USER: bugfixer
      POSTGRES_PASSWORD: bugfixer
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      FRONTEND_BASE_URL: http://localhost:3000
      PLAYWRIGHT_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply migrations
        working-directory: backend
        run: python manage.py migrate --no-input

      # Isolated test data: the SetupLock singleton (normally seeded by a
      # data migration, but this is a brand-new CI database so it's already
      # there from the migrate step above — this is belt-and-suspenders,
      # matching what global-setup.ts does for local runs) and the
      # dedicated, namespaced fixture e2e/bug-lifecycle.spec.ts depends on.
      - name: Seed SetupLock and the e2e bug fixture
        working-directory: backend
        run: |
          python manage.py shell -c "from apps.organizations.models import SetupLock; SetupLock.objects.get_or_create(id=1)"
          python manage.py seed_e2e_bug_fixture

      - name: Start backend server
        working-directory: backend
        run: nohup python manage.py runserver 0.0.0.0:8000 > backend.log 2>&1 &

      # Notification delivery (Phase 4 Chunk 3) runs through
      # apps.notifications.tasks via the real Redis broker in this
      # workflow (config.settings.development is not CELERY_TASK_ALWAYS_EAGER),
      # exactly like production — so without an actual worker consuming that
      # queue, every dispatched notification task would sit in Redis forever
      # and any spec asserting on notification state would hang until the
      # job timeout. This mirrors docker-compose.yml's separate
      # celery_worker service, which this CI job has no equivalent of
      # otherwise (there is no docker compose here, each process is started
      # directly).
      - name: Start Celery worker
        working-directory: backend
        run: nohup celery -A config worker --loglevel=info > celery.log 2>&1 &

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health/ > /dev/null && exit 0
            sleep 1
          done
          echo "Backend did not become ready in time" >&2
          cat backend/backend.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install Playwright's Chromium browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend server
        working-directory: frontend
        env:
          BACKEND_INTERNAL_URL: http://localhost:8000
        run: nohup npm run dev > frontend.log 2>&1 &

      - name: Wait for frontend to be ready
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000 > /dev/null && exit 0
            sleep 1
          done
          echo "Frontend did not become ready in time" >&2
          cat frontend/frontend.log
          exit 1

      # The backend/frontend servers above were started directly (no
      # docker compose in a CI runner), so global-setup.ts's own
      # docker-exec-based reset would fail here — SKIP_E2E_DB_RESET=true is
      # exactly the escape hatch it already documents for this case; the
      # equivalent reset already happened via the migrate + seed steps
      # above, against a database this job created fresh.
      - name: Run Playwright suite
        working-directory: frontend
        env:
          SKIP_E2E_DB_RESET: "true"
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            backend/backend.log
            backend/celery.log
            frontend/frontend.log
          retention-days: 14
