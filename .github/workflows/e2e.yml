name: e2e

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e.yml"

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # docker-compose.yml's backend/celery_worker/frontend all read
      # env_file: .env — .env.example's defaults are exactly the values a
      # fresh local clone would use per README's own "Local development"
      # quickstart, so this job's stack setup matches local dev exactly,
      # not a CI-only configuration that could drift from what a developer
      # actually runs. No real secret is required for any of it.
      - name: Create .env from the example template
        run: cp .env.example .env

      # Every run starts from zero pre-existing state: a fresh checkout, a
      # fresh Docker network/containers, and (per the explicit `down -v` in
      # the teardown step below, which always runs) no leftover named
      # volumes from a prior run — this job never reuses a stale
      # postgres_data volume across runs, on a hosted or self-hosted runner
      # alike.
      - name: Build images
        run: docker compose build

      - name: Start db, redis, backend, celery_worker, frontend
        run: docker compose up -d

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health/ > /dev/null && exit 0
            sleep 1
          done
          echo "Backend did not become ready in time" >&2
          docker compose logs backend
          exit 1

      # Started by docker compose up above, alongside backend — this proves
      # it's actually consuming from the broker (not just that its
      # container process launched) before any spec that depends on
      # notification/collaboration/dashboard delivery runs. Every spec in
      # this suite runs after this step, in one serial Playwright process
      # (see playwright.config.ts: fullyParallel: false, workers: 1) — so
      # there is no per-spec ordering dependency to manage beyond this one
      # job-level precondition.
      - name: Wait for Celery worker to be ready
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T celery_worker celery -A config inspect ping > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Celery worker did not become ready in time" >&2
          docker compose logs celery_worker
          exit 1

      - name: Wait for frontend to be ready
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000 > /dev/null && exit 0
            sleep 1
          done
          echo "Frontend did not become ready in time" >&2
          docker compose logs frontend
          exit 1

      # Schema only — global-setup.ts's own flush (below, via Playwright)
      # assumes the schema already exists; it deletes rows, not tables.
      - name: Apply migrations
        run: docker compose exec -T backend python manage.py migrate --no-input

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Playwright itself runs on the runner host, driving a browser
      # against the dockerized frontend at localhost:3000 (published by
      # docker-compose.yml) — same shape as a developer running `npm run
      # test:e2e` locally against their own already-running `docker compose
      # up` stack. frontend/node_modules here is Playwright's own
      # toolchain, unrelated to (and never mixed with) the frontend
      # container's own node_modules built inside its image.
      - name: Install Playwright's own dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright's Chromium browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # No SKIP_E2E_DB_RESET here: frontend/e2e/global-setup.ts's default
      # (non-skip) path — `docker compose exec -T backend python manage.py
      # flush` + reseeding SetupLock + both `seed_e2e_bug_fixture` and
      # `seed_e2e_analytics_fixture` — now runs for real, because this job
      # actually has docker compose (the raw-nohup'd-process approach this
      # workflow used before did not, which is why it needed the skip flag
      # and had to hand-duplicate a *partial* version of this same reset —
      # missing the analytics fixture dashboard.spec.ts depends on). Using
      # the real path here means CI exercises the exact same reset
      # sequence a developer runs locally, not a second, divergent one.
      - name: Run Playwright suite
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Collect service logs
        if: failure()
        run: docker compose logs > compose-logs.txt

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: compose-logs.txt
          retention-days: 14

      # Runs even if an earlier step failed — removes the containers, the
      # network, and (via -v) the named postgres_data volume, so the next
      # run never inherits this run's database state.
      - name: Tear down
        if: always()
        run: docker compose down -v
