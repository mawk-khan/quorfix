name: quorfix

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quorfix}
      POSTGRES_USER: ${POSTGRES_USER:-quorfix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quorfix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quorfix}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      # Targets the `dev` stage (see backend/Dockerfile), not the default
      # last stage (`production`), which has no dev/test dependencies and
      # runs as a non-root user with no source bind mount — wrong shape for
      # local development, where docker compose exec backend pytest/ruff
      # and the ./backend:/app bind mount below both need the dev stage.
      target: dev
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      target: dev
    command: celery -A config worker --loglevel=info
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      SERVICE_NAME: quorfix-worker
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # Targets the `dev` stage (see frontend/Dockerfile), not the default
      # last stage (`runner`), which hardcodes NODE_ENV=production for the
      # production image. Building against `runner` here meant every
      # `npm run dev` / `npm test` / `npm run lint` invocation against this
      # container inherited that production NODE_ENV — React silently
      # serves its production bundle either way, but for tests specifically
      # that strips React.act, which @testing-library/react depends on.
      target: dev
    command: npm run dev
    env_file: .env
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
